<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>植瓣日 - 纯净手机全屏版</title>
    <style>
      /* ==================== 1. 基础复位与极简美学 ==================== */
      :root {
        --bg-color: #f4f3ef;      /* 暖米色纸张底色 */
        --text-color: #3d3a34;    /* 柔和深灰 */
        --accent-color: #8da47e;  /* MUJI 风植被绿 */
        --border-color: #e6e2da;
        --card-bg: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      /* 纯净全屏手机画布环境 */
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        user-select: none;
      }

      .app-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .paper-grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        z-index: 99;
      }

      .top-bar {
        height: 50px;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100; /* 确保不被卡片遮挡 */
        background: rgba(244, 243, 239, 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-color);
      }
      .status-copy { font-size: 14px; font-weight: 600; }
      .avatar { width: 24px; height: 24px; border-radius: 50%; background: #dfdacb; border: none; }

      /* ==================== 2. 强透视 3D 错开纵深视口 ==================== */
      .wall-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        perspective: 600px; /* 适中的透视点，制造立体景深 */
        perspective-origin: center center;
        touch-action: none;
      }

      .wall-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 3D 照片卡片 */
      .plant-card {
        position: absolute;
        width: 145px;
        background: var(--card-bg);
        padding: 8px 8px 12px 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.03);
        border-radius: 12px;
        cursor: pointer;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: box-shadow 0.3s;
      }
      
      .plant-card .img-placeholder {
        width: 100%;
        height: 145px;
        background-color: #eeeadd;
        background-size: cover;
        background-position: center;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .plant-card .card-info { text-align: center; }
      .plant-card .card-title { font-size: 12px; font-weight: 600; color: var(--text-color); }
      .plant-card .card-pot { font-size: 10px; color: #9e988a; margin-top: 1px; }

      /* ==================== 3. 极简全屏相机取景框 ==================== */
      .camera-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 200;
        display: none; flex-direction: column; color: #fff;
      }
      .camera-layer[aria-hidden="false"] { display: flex; }
      .camera-frame { flex: 1; display: flex; flex-direction: column; position: relative; }
      
      .camera-topline { 
        height: 50px; padding: 0 20px; 
        display: flex; justify-content: space-between; align-items: center; 
        font-size: 11px; letter-spacing: 2px; z-index: 210;
        background: rgba(0,0,0,0.4);
      }
      .camera-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
      .camera-close::before { content: "✕"; }
      
      .viewfinder { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; cursor: pointer; }
      #cameraPreview { width: 100%; height: 100%; object-fit: cover; }
      
      .viewfinder-hint {
        position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
        font-size: 12px; color: rgba(255,255,255,0.7); pointer-events: none;
        background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 20px;
      }

      .shutter-flash {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: white; opacity: 0; pointer-events: none; z-index: 220;
      }

      /* ==================== 4. 详情抽屉与表单弹窗 ==================== */
      .detail-sheet {
        position: absolute; top: 0; right: -100%;
        width: 100%; height: 100%;
        background: var(--card-bg); box-shadow: -5px 0 30px rgba(0,0,0,0.08);
        z-index: 150; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        padding: 30px; display: flex; flex-direction: column;
      }
      .detail-sheet[aria-hidden="false"] { right: 0; }
      .sheet-close { background: none; border: none; font-size: 24px; cursor: pointer; margin-bottom: 20px; text-align: left;}
      .sheet-close::before { content: "✕"; }

      .detail-pot-badge { font-size: 11px; color: #9e988a; text-transform: uppercase; margin-bottom: 4px; }
      .detail-title { font-size: 22px; font-weight: 500; margin-bottom: 15px; }
      .history-section { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; }
      .history-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #999; }
      .history-item { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; }
      
      .recommend-box {
        margin-top: auto; background: #f4f6f2;
        border: 1px dashed var(--accent-color); padding: 15px; border-radius: 8px;
        margin-bottom: 60px; /* 避免挡到返回键 */
      }
      .recommend-box h4 { font-size: 13px; color: var(--accent-color); margin-bottom: 8px; }
      .rec-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .rec-tag { font-size: 12px; background: #fff; padding: 4px 8px; border: 1px solid #e1e6dc; color: #5a6b51; border-radius: 4px; }

      .modal-overlay {
        position: absolute; top:0; left:0; width:100%; height:100%;
        background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 300;
        display: none; justify-content: center; align-items: center;
      }
      .input-modal { background: var(--card-bg); padding: 25px; border-radius: 16px; width: 85%; max-width: 300px; }
      .input-modal h3 { font-size: 15px; margin-bottom: 12px; }
      .input-modal input, .input-modal select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 8px; }
      .input-modal button { width: 100%; padding: 12px; background: var(--text-color); color: #fff; border: none; border-radius: 8px; font-weight: 600; }

      /* ==================== 5. 底部常规全幅高可见导航栏 ==================== */
      .bottom-dock {
        height: 65px; 
        border-top: 1px solid var(--border-color);
        background: rgba(244, 243, 239, 0.95); 
        backdrop-filter: blur(10px);
        display: flex; 
        justify-content: space-around; 
        align-items: center; 
        z-index: 110; /* 必须高于 3D 画布，确保永远可点 */
        padding-bottom: env(safe-area-inset-bottom);
      }
      .dock-item { 
        background: none; border: none; font-size: 13px; color: #a39e93; 
        padding: 12px 24px; font-weight: 600; cursor: pointer;
      }
      .dock-item.active { color: var(--text-color); font-weight: 700; position: relative; }
      .dock-item.active::after { content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--text-color); border-radius: 50%; }
    </style>
  </head>
  <body>

    <main class="app-shell">
      <div class="paper-grain"></div>

      <header class="top-bar">
        <div class="status-copy"><span id="clock">15:18</span></div>
        <button class="avatar" type="button"></button>
      </header>

      <section class="wall-viewport" id="wallViewport">
        <div class="wall-canvas" id="wallCanvas"></div>
      </section>

      <aside class="detail-sheet" id="detailSheet" aria-hidden="true">
        <button class="sheet-close" id="detailClose" type="button"></button>
        <div id="detailContent"></div>
      </aside>

      <section class="camera-layer" id="cameraLayer" aria-hidden="true">
        <div class="shutter-flash" id="shutterFlash"></div>
        <div class="camera-frame">
          <div class="camera-topline">
            <button class="camera-close" id="cameraClose" type="button"></button>
            <span>RECORD MODE</span>
          </div>
          <div class="viewfinder" id="viewfinderShutter">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div class="focus-line focus-line-a"></div><div class="focus-line focus-line-b"></div>
            <div class="viewfinder-hint">点击屏幕任意位置拍照</div>
            <canvas id="photoCanvas" style="display: none;"></canvas>
          </div>
        </div>
      </section>

      <div class="modal-overlay" id="inputModal">
        <div class="input-modal">
          <h3>新种植作物登记</h3>
          <input type="text" id="inputPotId" placeholder="花盆编号 (如: #A01)" />
          <input type="text" id="inputName" placeholder="植物名称 (如: 圣女果)" />
          <select id="inputFamily">
            <option value="茄科">茄科 (番茄、辣椒、茄子)</option>
            <option value="十字花科">十字花科 (白菜、西兰花)</option>
            <option value="葫芦科">葫芦科 (黄瓜、南瓜、丝瓜)</option>
            <option value="豆科">豆科 (豌豆、豇豆、扁豆)</option>
          </select>
          <button id="savePlantBtn">确认并加入空间</button>
        </div>
      </div>

      <nav class="bottom-dock">
        <button class="dock-item active" data-mode="wall" type="button">空间墙</button>
        <button class="dock-item" data-mode="record" type="button">拍摄录入</button>
      </nav>
    </main>

    <script>
      // 1. 模拟底层数据库
      const MOCK_DATA = {
        pots: [
          { pot_id: "#A01", current_plant: "樱桃番茄", current_family: "茄科", photo: "https://images.unsplash.com/photo-1592417817098-8f3d6eb19675?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"黄瓜", family:"葫芦科"}] },
          { pot_id: "#B03", current_plant: "羽衣甘蓝", current_family: "十字花科", photo: "https://images.unsplash.com/photo-1628773822503-930a84518776?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"大豆", family:"豆科"}] },
          { pot_id: "#C02", current_plant: "水果黄瓜", current_family: "葫芦科", photo: "https://images.unsplash.com/photo-1590165482129-1b8b27698780?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"甜椒", family:"茄科"}] },
          { pot_id: "#D05", current_plant: "矮生四季豆", current_family: "豆科", photo: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?auto=format&fit=crop&w=300&q=80", history: [] },
          { pot_id: "#E01", current_plant: "罗勒薄荷", current_family: "唇形科", photo: "https://images.unsplash.com/photo-1536882240095-0379873feb4e?auto=format&fit=crop&w=300&q=80", history: [] },
          { pot_id: "#F02", current_plant: "彩椒", current_family: "茄科", photo: "https://images.unsplash.com/photo-1595855759920-86582396756a?auto=format&fit=crop&w=300&q=80", history: [] }
        ],
        plant_families: {
          "茄科": ["番茄", "辣椒", "茄子", "马铃薯"],
          "十字花科": ["小白菜", "西兰花", "羽衣甘蓝"],
          "葫芦科": ["黄瓜", "南瓜", "丝瓜"],
          "豆科": ["豆角", "豌豆", "毛豆"]
        }
      };

      // 2. 空间手势状态
      let transformState = { x: 0, y: 0, z: -100 };
      let isDragging = false;
      let startPointer = { x: 0, y: 0 };
      let touchStartDist = 0;
      let touchStartZ = 0;

      let cameraStream = null;
      let tempCapturedPhoto = "";

      const wallViewport = document.getElementById('wallViewport');
      const wallCanvas = document.getElementById('wallCanvas');
      const cameraLayer = document.getElementById('cameraLayer');
      const cameraPreview = document.getElementById('cameraPreview');
      const photoCanvas = document.getElementById('photoCanvas');
      const viewfinderShutter = document.getElementById('viewfinderShutter');
      const shutterFlash = document.getElementById('shutterFlash');
      const inputModal = document.getElementById('inputModal');
      const detailSheet = document.getElementById('detailSheet');
      const detailContent = document.getElementById('detailContent');

      // 时间刷新
      setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }, 1000);

      // 3. 【重构修复】立体散开交错算法（解决全部重叠在中心的问题）
      function render3DWall() {
        wallCanvas.innerHTML = "";
        
        MOCK_DATA.pots.forEach((pot, index) => {
          const card = document.createElement('div');
          card.className = "plant-card";
          
          // Z 轴按固定阶梯向极深处推入（制造完美的近大远小纵深）
          const posZ = index * -220; 
          
          // X 和 Y 轴采用螺旋散开排列，打破中心堆叠
          // 奇数往左下，偶数往右上，并随深度递增散开半径
          const angle = index * 1.1; 
          const radius = 110 + (index * 20); // 增大基础初始半径，强行散开
          
          const posX = Math.cos(angle) * radius;
          const posY = Math.sin(angle) * radius * 0.8; // 稍微压扁高度，适配手机高屏比

          card.style.transform = `translate3d(${posX}px, ${posY}px, ${posZ}px)`;
          
          card.innerHTML = `
            <div class="img-placeholder" style="background-image: url('${pot.photo}')"></div>
            <div class="card-info">
              <div class="card-title">${pot.current_plant}</div>
              <div class="card-pot">${pot.pot_id}</div>
            </div>
          `;
          
          // 拦截点击事件进入详情卡片
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            showPotDetail(pot);
          });
          wallCanvas.appendChild(card);
        });
        updateCanvasTransform();
      }

      function updateCanvasTransform() {
        wallCanvas.style.transform = `translate3d(${transformState.x}px, ${transformState.y}px, ${transformState.z}px)`;
      }

      function getTouchDistance(touches) {
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
      }

      // 4. 手势交互：支持双指缩放推拉、单指或鼠标拖动平移
      function onPointerDown(e) {
        const isTouch = e.touches ? true : false;
        if (isTouch && e.touches.length === 2) {
          isDragging = false;
          touchStartDist = getTouchDistance(e.touches);
          touchStartZ = transformState.z;
        } else {
          isDragging = true;
          const clientX = isTouch ? e.touches[0].clientX : e.clientX;
          const clientY = isTouch ? e.touches[0].clientY : e.clientY;
          startPointer = { x: clientX - transformState.x, y: clientY - transformState.y };
        }
      }

      function onPointerMove(e) {
        const isTouch = e.touches ? true : false;
        if (isTouch && e.touches.length === 2) {
          const currentDist = getTouchDistance(e.touches);
          const factor = currentDist / touchStartDist;
          transformState.z = touchStartZ + (factor - 1) * 450; // 提高推拉敏感度
          transformState.z = Math.min(500, Math.max(-1500, transformState.z)); 
          updateCanvasTransform();
        } else if (isDragging) {
          const clientX = isTouch ? e.touches[0].clientX : e.clientX;
          const clientY = isTouch ? e.touches[0].clientY : e.clientY;
          transformState.x = clientX - startPointer.x;
          transformState.y = clientY - startPointer.y;
          updateCanvasTransform();
        }
      }

      wallViewport.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', () => isDragging = false);
      wallViewport.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', () => isDragging = false);
      
      wallViewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        transformState.z += e.deltaY * -0.6;
        transformState.z = Math.min(500, Math.max(-1500, transformState.z));
        updateCanvasTransform();
      });

      // 5. 智能防病害轮作推荐
      function showPotDetail(pot) {
        const bannedFamilies = [pot.current_family, ...pot.history.map(h => h.family)];
        let recommendations = [];
        for (let family in MOCK_DATA.plant_families) {
          if (!bannedFamilies.includes(family)) {
            recommendations.push(...MOCK_DATA.plant_families[family]);
          }
        }

        detailContent.innerHTML = `
          <div class="detail-pot-badge">${pot.pot_id} 号花盆</div>
          <h2 class="detail-title">${pot.current_plant} <span style="font-size:13px;color:#8da47e;">[${pot.current_family}]</span></h2>
          
          <div class="history-section">
            <h3 class="history-title">历史种植记录</h3>
            <div class="history-item"><span>2026年 (当前季)</span><span>${pot.current_plant} (${pot.current_family})</span></div>
            ${pot.history.map(h => `<div class="history-item"><span>${h.year}年</span><span>${h.plant} (${h.family})</span></div>`).join('')}
          </div>

          <div class="recommend-box">
            <h4>💡 下一季作物智能推荐</h4>
            <div class="rec-tags">
              ${recommendations.slice(0, 4).map(r => `<span class="rec-tag">${r}</span>`).join('')}
            </div>
          </div>
        `;
        detailSheet.setAttribute('aria-hidden', 'false');
      }

      document.getElementById('detailClose').addEventListener('click', () => detailSheet.setAttribute('aria-hidden', 'true'));

      // 6. 无按钮快门抓拍处理
      async function startCamera() {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1080 } },
            audio: false
          });
          cameraPreview.srcObject = cameraStream;
          cameraLayer.setAttribute('aria-hidden', 'false');
        } catch (err) {
          // 兜底环境提示
          alert("提示：未检测到硬件相机。原型将自动开启手动登记表单流程。");
          stopCamera();
          inputModal.style.display = 'flex';
        }
      }

      function stopCamera() {
        if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
        cameraPreview.srcObject = null;
        cameraLayer.setAttribute('aria-hidden', 'true');
      }

      // 点击取景框任意处抓拍
      viewfinderShutter.addEventListener('click', () => {
        if (!cameraStream) return;
        
        shutterFlash.style.opacity = '1';
        setTimeout(() => shutterFlash.style.opacity = '0', 150);

        const ctx = photoCanvas.getContext('2d');
        photoCanvas.width = cameraPreview.videoWidth;
        photoCanvas.height = cameraPreview.videoHeight;
        ctx.drawImage(cameraPreview, 0, 0, photoCanvas.width, photoCanvas.height);
        
        tempCapturedPhoto = photoCanvas.toDataURL('image/jpeg');
        
        setTimeout(() => {
          stopCamera();
          inputModal.style.display = 'flex';
        }, 200);
      });

      document.getElementById('cameraClose').addEventListener('click', () => { stopCamera(); switchTab('wall'); });

      document.getElementById('savePlantBtn').addEventListener('click', () => {
        const potId = document.getElementById('inputPotId').value.trim() || `#P0${MOCK_DATA.pots.length + 1}`;
        const name = document.getElementById('inputName').value.trim() || "新农作物";
        const family = document.getElementById('inputFamily').value;

        MOCK_DATA.pots.unshift({
          pot_id: potId, current_plant: name, current_family: family, photo: tempCapturedPhoto || "https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=300&q=80", history: []
        });

        inputModal.style.display = 'none';
        document.getElementById('inputPotId').value = "";
        document.getElementById('inputName').value = "";
        switchTab('wall');
        render3DWall();
      });

      // 切换模式控制
      const dockItems = document.querySelectorAll('.dock-item');
      function switchTab(mode) {
        dockItems.forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.querySelector(`[data-mode="${mode}"]`);
        if(targetBtn) targetBtn.classList.add('active');

        detailSheet.setAttribute('aria-hidden', 'true');
        if (mode === 'record') { startCamera(); } else { stopCamera(); }
      }

      dockItems.forEach(item => {
        item.addEventListener('click', () => switchTab(item.getAttribute('data-mode')));
      });

      // 初始化初次加载
      render3DWall();
    </script>
  </body>
</html>
