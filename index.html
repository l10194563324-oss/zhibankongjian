<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>植瓣日 - 触控全修复版</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
      /* ==================== 1. 字体系统与基础画廊美学 ==================== */
      :root {
        --bg-color: #ede9e1;      /* 侘寂泥土原色底 */
        --text-color: #262421;    /* 矿物深灰 */
        --accent-color: #55604e;  /* 苔藓灰绿 */
        --border-color: #dad4c9;
        --card-bg: #ffffff;
        
        --font-serif: "Playfair Display", Georgia, serif;
        --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
        background-color: var(--bg-color);
        color: var(--text-color);
        user-select: none;
        font-family: var(--font-sans);
        font-weight: 200;
        -webkit-font-smoothing: antialiased;
        touch-action: none; 
      }

      .serif-heading {
        font-family: var(--font-serif);
        font-weight: 400;
        letter-spacing: 0.05em;
      }

      .app-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* 真实土墙面纹理质感 */
      .wall-clay-texture {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.14;
        pointer-events: none;
        z-index: 99;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='clayNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='5' stitchTiles='stitch'/%3E%3CfeDiffuseLighting in='texture' lighting-color='%23fff' surfaceScale='3'%3E%3CfeDistantLight azimuth='45' elevation='60'/%3E%3C/feDiffuseLighting%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23clayNoise)'/%3E%3C/svg%3E");
      }

      .top-bar {
        height: 50px;
        padding: 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 120;
        background: rgba(237, 233, 225, 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-color);
        padding-top: env(safe-area-inset-top);
      }
      .status-copy { font-size: 14px; font-weight: 600; font-family: var(--font-serif); letter-spacing: 0.05em;}
      .avatar { width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 1px solid var(--text-color); }

      /* ==================== 2. 3D 照片墙视口 ==================== */
      .wall-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        perspective: 600px; 
        perspective-origin: center center;
      }
      .wall-viewport[aria-hidden="true"] { display: none; }

      .wall-canvas {
        position: absolute;
        width: 100%; height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
        display: flex; justify-content: center; align-items: center;
        pointer-events: none;
      }

      .plant-card {
        position: absolute;
        width: 140px;
        background: var(--card-bg);
        padding: 8px 8px 12px 8px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.03);
        border: 1px solid var(--border-color);
        cursor: pointer;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        pointer-events: auto;
      }
      .plant-card .img-placeholder {
        width: 100%; height: 140px; background-color: #e5e0d5; background-size: cover; background-position: center;
      }
      .plant-card .card-info { text-align: left; padding: 6px 2px 0 2px; }
      .plant-card .card-title { font-size: 12px; font-weight: 400; color: var(--text-color); }
      .plant-card .card-pot { font-size: 10px; color: #888; font-family: var(--font-serif); margin-top: 2px; }

      /* ==================== 3. Diary 区域（全面开启横向可滑动轴） ==================== */
      .diary-viewport {
        flex: 1;
        position: relative;
        overflow-y: auto;
        padding: 24px;
        display: none;
        background: var(--bg-color);
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y; 
      }
      .diary-viewport[aria-hidden="false"] { display: block; }
      
      .diary-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--text-color);
        padding-bottom: 12px;
      }
      .diary-header h2 { font-size: 24px; }
      
      .year-switcher {
        background: none; border: none; font-family: var(--font-serif);
        font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-color);
        border-bottom: 1px dashed var(--text-color); padding-bottom: 2px;
      }

      /* 【关键重构】允许内容溢出，并开启手机端单指横向流畅滑动 */
      .chart-container {
        width: 100%;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 20px 0px 10px 0px; 
        margin-bottom: 30px;
        overflow-x: auto; 
        -webkit-overflow-scrolling: touch; 
        touch-action: pan-x; 
      }
      .chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #777; margin-bottom: 15px; padding-left: 15px; }
      
      /* 取消固定 100% 宽度，使其宽度可以被 JS 动态撑长以实现拖拽移动 */
      #diaryCanvasElement { 
        height: 220px; 
        display: block; 
      }

      /* ==================== 4. 全屏录制相机 ==================== */
      .camera-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 200;
        display: none; flex-direction: column; color: #fff;
      }
      .camera-layer[aria-hidden="false"] { display: flex; }
      .camera-frame { flex: 1; display: flex; flex-direction: column; position: relative; }
      .camera-topline { height: 50px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 2px; z-index: 210; background: rgba(0,0,0,0.4); padding-top: env(safe-area-inset-top); }
      .camera-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
      .camera-close::before { content: "✕"; }
      .viewfinder { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; cursor: pointer; }
      #cameraPreview { width: 100%; height: 100%; object-fit: cover; }
      .viewfinder-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.7); pointer-events: none; border: 1px solid rgba(255,255,255,0.4); padding: 6px 16px; width: max-content; }
      .shutter-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 220; }

      /* ==================== 5. 右上角白描小✕统一弹窗系统 ==================== */
      .detail-sheet {
        position: absolute; top: 0; right: -100%;
        width: 100%; height: 100%;
        background: var(--card-bg); box-shadow: -5px 0 30px rgba(0,0,0,0.05);
        z-index: 250; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        padding: 24px; display: flex; flex-direction: column;
        overflow-y: auto;
      }
      .detail-sheet[aria-hidden="false"] { right: 0; }
      
      /* 右上角绝对定位关闭按钮 */
      .corner-close { 
        position: absolute; 
        top: 14px; 
        right: 14px;
        background: none; 
        border: none; 
        font-size: 18px; 
        cursor: pointer; 
        color: var(--text-color); 
        z-index: 999; /* 强行确保顶层置顶 */
        padding: 12px; 
      }
      .corner-close::before { content: "✕"; }

      .detail-photo-frame {
        width: 100%; height: 200px; background-size: cover; background-position: center; margin-top: 24px; margin-bottom: 16px; border: 1px solid var(--border-color);
      }
      .detail-pot-badge { font-size: 11px; color: #888; font-family: var(--font-serif); margin-top: 15px; margin-bottom: 4px; }
      .detail-title { font-size: 24px; margin-bottom: 12px; }
      .history-section { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
      .history-title { font-size: 11px; font-weight: 600; margin-bottom: 8px; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
      .history-item { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; font-weight: 300; }
      .recommend-box { margin-top: auto; border-top: 1px solid var(--text-color); padding-top: 15px; padding-bottom: env(safe-area-inset-bottom); }
      .recommend-box h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
      .rec-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .rec-tag { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border-color); color: var(--text-color); font-weight: 300; }

      /* Save Data 登记信息表单浮层 */
      .modal-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 300; display: none; justify-content: center; align-items: center; }
      
      /* 【布局重构】白色登记小卡片 */
      .input-modal { 
        position: relative; 
        background: var(--card-bg); 
        padding: 45px 20px 20px 20px; /* 预留顶部安全距离给关闭按钮 */
        width: 86%; 
        max-width: 320px; 
        border: 1px solid var(--text-color); 
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      }
      .input-modal h3 { font-size: 14px; margin-bottom: 20px; text-align: center; letter-spacing: 0.05em; font-weight: 400;}
      .input-modal input, .input-modal select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); font-size: 13px; font-family: var(--font-sans); background: transparent; outline: none; font-weight: 200; border-radius: 0; }
      .input-modal button { width: 100%; padding: 12px; background: var(--text-color); color: #fff; border: none; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; font-size: 11px; margin-top: 5px; cursor: pointer; }

      /* ==================== 6. 底部导航栏 ==================== */
      .bottom-dock {
        height: 65px; border-top: 1px solid var(--border-color);
        background: rgba(237, 233, 225, 0.95); backdrop-filter: blur(10px);
        display: flex; justify-content: space-around; align-items: center; 
        z-index: 130; 
        padding-bottom: env(safe-area-inset-bottom);
      }
      .dock-item { 
        background: none; border: none; font-size: 11px; color: #a39e93; padding: 12px 24px; 
        font-weight: 400; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-sans);
      }
      .dock-item.active { color: var(--text-color); font-weight: 700; position: relative; }
      .dock-item.active::after { content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 12px; height: 1px; background: var(--text-color); }
    </style>
  </head>
  <body>

    <main class="app-shell">
      <div class="wall-clay-texture"></div>

      <header class="top-bar">
        <div class="status-copy serif-heading"><span id="clock">17:14</span></div>
        <button class="avatar" type="button"></button>
      </header>

      <section class="wall-viewport" id="wallViewport" aria-hidden="false">
        <div class="wall-canvas" id="wallCanvas"></div>
      </section>

      <section class="diary-viewport" id="diaryViewport" aria-hidden="true">
        <div class="diary-header">
          <h2 class="serif-heading" id="diaryYearTitle">2026 Chronology</h2>
          <button class="year-switcher" id="yearSwitcherBtn" type="button">查看 2025 年</button>
        </div>
        
        <div class="chart-container" id="diaryChartZone">
          <div class="chart-title">Monthly Planting Distribution Curves</div>
          <canvas id="diaryCanvasElement"></canvas>
        </div>
      </section>

      <aside class="detail-sheet" id="detailSheet" aria-hidden="true">
        <button class="corner-close" id="detailClose" type="button" aria-label="Close"></button>
        <div id="detailContent"></div>
      </aside>

      <section class="camera-layer" id="cameraLayer" aria-hidden="true">
        <div class="shutter-flash" id="shutterFlash"></div>
        <div class="camera-frame">
          <div class="camera-topline">
            <button class="camera-close" id="cameraClose" type="button"></button>
            <span>RECORD MODE</span>
          </div>
          <div class="viewfinder" id="viewfinderShutter">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div class="viewfinder-hint">TAP SCREEN TO CAPTURE</div>
            <canvas id="photoCanvas" style="display: none;"></canvas>
          </div>
        </div>
      </section>

      <div class="modal-overlay" id="inputModal">
        <div class="input-modal">
          <button class="corner-close" id="inputModalClose" type="button" aria-label="Close"></button>
          <h3 class="serif-heading">NEW DATA</h3>
          <input type="text" id="inputPotId" placeholder="花盆编号 (如: #A01)" />
          <input type="text" id="inputName" placeholder="植物名称 (如: 圣女果)" />
          <select id="inputFamily">
            <option value="茄科">茄科 (番茄、辣椒、茄子)</option>
            <option value="十字花科">十字花科 (白菜、西兰花)</option>
            <option value="葫芦科">葫芦科 (黄瓜、南瓜、丝瓜)</option>
            <option value="豆科">豆科 (豌豆、豇豆、扁豆)</option>
          </select>
          <input type="date" id="inputDate" value="2026-06-06" />
          <button id="savePlantBtn">SAVE DATA</button>
        </div>
      </div>

      <nav class="bottom-dock">
        <button class="dock-item active" data-mode="wall" type="button">Wall</button>
        <button class="dock-item" data-mode="record" type="button">Record</button>
        <button class="dock-item" data-mode="diary" type="button">Diary</button>
      </nav>
    </main>

    <script>
      const DATABASE = {
        currentYear: 2026,
        pots: [
          { pot_id: "#A01", current_plant: "樱桃番茄", current_family: "茄科", date: "2026-03-12", month: 3, photo: "https://images.unsplash.com/photo-1592417817098-8f3d6eb19675?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"黄瓜", family:"葫芦科", date:"2025-04-10"}] },
          { pot_id: "#B03", current_plant: "羽衣甘蓝", current_family: "十字花科", date: "2026-05-20", month: 5, photo: "https://images.unsplash.com/photo-1628773822503-930a84518776?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"大豆", family:"豆科", date:"2025-05-11"}] },
          { pot_id: "#C02", current_plant: "水果黄瓜", current_family: "葫芦科", date: "2026-04-05", month: 4, photo: "https://images.unsplash.com/photo-1590165482129-1b8b27698780?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"甜椒", family:"茄科", date:"2025-03-20"}] },
          { pot_id: "#D05", current_plant: "矮生四季豆", current_family: "豆科", date: "2026-02-18", month: 2, photo: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"罗勒", family:"唇形科", date:"2025-06-01"}] },
          { pot_id: "#E01", current_plant: "胡椒薄荷", current_family: "唇形科", date: "2026-05-02", month: 5, photo: "https://images.unsplash.com/photo-1536882240095-0379873feb4e?auto=format&fit=crop&w=300&q=80", history: [] },
          { pot_id: "#F02", current_plant: "五彩观赏椒", current_family: "茄科", date: "2026-01-22", month: 1, photo: "https://images.unsplash.com/photo-1595855759920-86582396756a?auto=format&fit=crop&w=300&q=80", history: [] }
        ],
        plant_families: {
          "茄科": ["番茄", "辣椒", "茄子", "马铃薯"],
          "十字花科": ["小白菜", "西兰花", "羽衣甘蓝"],
          "葫芦科": ["黄瓜", "南瓜", "丝瓜"],
          "豆科": ["豆角", "豌豆", "毛豆"]
        }
      };

      let transformState = { x: 0, y: 0, z: -100 };
      let isDragging = false;
      let startPointer = { x: 0, y: 0 };
      let touchStartDist = 0;
      let touchScaleZ = 0;

      // Diary 区域手势变量
      let chartScaleX = 1.0; 
      let startChartScaleX = 1.0;
      let chartTouchStartDist = 0;
      let isPinchingChart = false;

      let cameraStream = null;
      let tempCapturedPhoto = "";
      let chartClickRegions = [];

      const wallViewport = document.getElementById('wallViewport');
      const diaryViewport = document.getElementById('diaryViewport');
      const diaryChartZone = document.getElementById('diaryChartZone');
      const wallCanvas = document.getElementById('wallCanvas');
      const cameraLayer = document.getElementById('cameraLayer');
      const cameraPreview = document.getElementById('cameraPreview');
      const photoCanvas = document.getElementById('photoCanvas');
      const viewfinderShutter = document.getElementById('viewfinderShutter');
      const shutterFlash = document.getElementById('shutterFlash');
      const inputModal = document.getElementById('inputModal');
      const detailSheet = document.getElementById('detailSheet');
      const detailContent = document.getElementById('detailContent');
      const diaryCanvasElement = document.getElementById('diaryCanvasElement');
      const yearSwitcherBtn = document.getElementById('yearSwitcherBtn');
      const diaryYearTitle = document.getElementById('diaryYearTitle');

      document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

      setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }, 1000);

      // 3D 照片墙无死角渲染
      function render3DWall() {
        wallCanvas.innerHTML = "";
        DATABASE.pots.forEach((pot, index) => {
          const card = document.createElement('div');
          card.className = "plant-card";
          
          const posZ = index * -220; 
          const angle = index * 1.1; 
          const radius = 110 + (index * 22); 
          const posX = Math.cos(angle) * radius;
          const posY = Math.sin(angle) * radius * 0.75;

          card.style.transform = `translate3d(${posX}px, ${posY}px, ${posZ}px)`;
          card.style.zIndex = Math.floor(1000 + posZ);

          card.innerHTML = `
            <div class="img-placeholder" style="background-image: url('${pot.photo}')"></div>
            <div class="card-info">
              <div class="card-title">${pot.current_plant}</div>
              <div class="card-pot serif-heading">${pot.pot_id}</div>
            </div>
          `;
          
          card.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showPotDetail(pot.pot_id);
          });
          
          wallCanvas.appendChild(card);
        });
        updateCanvasTransform();
      }

      function updateCanvasTransform() {
        wallCanvas.style.transform = `translate3d(${transformState.x}px, ${transformState.y}px, ${transformState.z}px)`;
      }

      // 照片墙防死锁触控引擎
      function onPointerDown(e) {
        const isTouch = e.touches ? true : false;
        if (isTouch && e.touches.length === 2) {
          isDragging = false;
          touchStartDist = getTouchDistance(e.touches);
          touchScaleZ = transformState.z;
        } else {
          if (e.target.closest('.plant-card')) return;
          isDragging = true;
          const clientX = isTouch ? e.touches[0].clientX : e.clientX;
          const clientY = isTouch ? e.touches[0].clientY : e.clientY;
          startPointer = { x: clientX - transformState.x, y: clientY - transformState.y };
        }
      }

      function onPointerMove(e) {
        if (e.cancelable) e.preventDefault();
        const isTouch = e.touches ? true : false;
        if (isTouch && e.touches.length === 2) {
          const currentDist = getTouchDistance(e.touches);
          const factor = currentDist / touchStartDist;
          transformState.z = touchScaleZ + (factor - 1) * 450;
          transformState.z = Math.min(500, Math.max(-1500, transformState.z)); 
          updateCanvasTransform();
        } else if (isDragging) {
          const clientX = isTouch ? e.touches[0].clientX : e.clientX;
          const clientY = isTouch ? e.touches[0].clientY : e.clientY;
          transformState.x = clientX - startPointer.x;
          transformState.y = clientY - startPointer.y;
          updateCanvasTransform();
        }
      }

      wallViewport.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', () => isDragging = false);
      wallViewport.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', () => isDragging = false);
      wallViewport.addEventListener('wheel', (e) => { e.preventDefault(); transformState.z += e.deltaY * -0.6; transformState.z = Math.min(500, Math.max(-1500, transformState.z)); updateCanvasTransform(); });

      // ==================== 📈 Diary 双指缩放事件驱动处理 ====================
      diaryChartZone.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinchingChart = true;
          chartTouchStartDist = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
          startChartScaleX = chartScaleX;
        }
      }, { passive: true });

      diaryChartZone.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinchingChart) {
          if (e.cancelable) e.preventDefault();
          const currentDist = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
          if (chartTouchStartDist > 5) {
            const factor = currentDist / chartTouchStartDist;
            chartScaleX = startChartScaleX * factor;
            chartScaleX = Math.min(3.5, Math.max(1.0, chartScaleX)); // 扩展缩放上限到3.5倍
            drawDiaryCurves();
          }
        }
      }, { passive: false });

      diaryChartZone.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) isPinchingChart = false;
      });

      // 联动弹出独立的详情档案
      function showPotDetail(potId) {
        const pot = DATABASE.pots.find(p => p.pot_id === potId);
        if(!pot) return;

        const bannedFamilies = [pot.current_family, ...pot.history.map(h => h.family)];
        let recommendations = [];
        for (let family in DATABASE.plant_families) {
          if (!bannedFamilies.includes(family)) { recommendations.push(...DATABASE.plant_families[family]); }
        }

        detailContent.innerHTML = `
          <div class="detail-photo-frame" style="background-image: url('${pot.photo}')"></div>
          <div class="detail-pot-badge serif-heading">${pot.pot_id} ARCHIVE</div>
          <h2 class="detail-title serif-heading">${pot.current_plant}</h2>
          <p style="font-size:12px; color:#555; margin-top:-6px; margin-bottom:5px;">所属科系：${pot.current_family}</p>
          <p style="font-size:11px; font-family:var(--font-serif); font-style:italic; color:#888;">种植登记时间：${pot.date}</p>
          
          <div class="history-section">
            <h3 class="history-title">Crop Rotation Timeline</h3>
            <div class="history-item"><span>2026年 (当前季)</span><span style="font-weight:400;">${pot.current_plant} [${pot.date}]</span></div>
            ${pot.history.map(h => `<div class="history-item"><span>${h.year}年 (历史季)</span><span>${h.plant} [${h.date || '无资料'}]</span></div>`).join('')}
          </div>

          <div class="recommend-box">
            <h4>💡 NEXT SEASON SUGGESTION</h4>
            <div class="rec-tags">
              ${recommendations.slice(0, 4).map(r => `<span class="rec-tag">${r}</span>`).join('')}
            </div>
          </div>
        `;
        detailSheet.setAttribute('aria-hidden', 'false');
      }

      document.getElementById('detailClose').addEventListener('click', () => detailSheet.setAttribute('aria-hidden', 'true'));
      document.getElementById('inputModalClose').addEventListener('click', () => inputModal.style.display = 'none');

      // ==================== 🛠️ Canvas 曲线重绘渲染与物理尺寸撑长 ====================
      function drawDiaryCurves() {
        const canvas = diaryCanvasElement;
        const ctx = canvas.getContext('2d');
        const containerWidth = canvas.parentElement.clientWidth;
        const height = 220;
        
        // 【关键重构】：真实的让 Canvas 节点随缩放比例成倍变宽，从而利用原生容器的 overflow-x 进行无级横向拖移
        const dynamicWidth = containerWidth * chartScaleX;
        canvas.style.width = `${dynamicWidth}px`;
        
        canvas.width = dynamicWidth * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        ctx.clearRect(0, 0, dynamicWidth, height);
        chartClickRegions = [];

        const monthlyCounts = Array(12).fill(0);
        const monthlyPots = Array(12).fill(null).map(() => []);

        DATABASE.pots.forEach(pot => {
          if (DATABASE.currentYear === 2026) {
            const m = pot.month - 1; 
            if(m >= 0 && m < 12) { monthlyCounts[m]++; monthlyPots[m].push(pot.pot_id); }
          } else {
            pot.history.forEach(h => {
              if (h.year === 2025) {
                const hMonth = h.date ? parseInt(h.date.split('-')[1]) - 1 : 4;
                monthlyCounts[hMonth]++;
                if(!monthlyPots[hMonth].includes(pot.pot_id)) monthlyPots[hMonth].push(pot.pot_id);
              }
            });
          }
        });

        const padding = { top: 30, right: 40, bottom: 40, left: 40 };
        const graphWidth = dynamicWidth - padding.left - padding.right;
        const graphHeight = height - padding.top - padding.bottom;

        ctx.strokeStyle = '#e8e5de';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 3; i++) {
          const y = padding.top + (graphHeight / 3) * i;
          ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(dynamicWidth - padding.right, y); ctx.stroke();
        }

        const points = [];
        for (let i = 0; i < 12; i++) {
          const x = padding.left + (graphWidth / 11) * i;
          const maxVal = Math.max(...monthlyCounts, 2);
          const y = padding.top + graphHeight - (monthlyCounts[i] / maxVal) * graphHeight;
          points.push({ x, y, count: monthlyCounts[i], pots: monthlyPots[i] });
        }

        ctx.strokeStyle = '#262421';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 0; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
        ctx.stroke();

        points.forEach((pt, i) => {
          ctx.fillStyle = '#777';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          const monthsText = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          ctx.fillText(monthsText[i], pt.x, height - padding.bottom + 15);

          if (pt.count > 0) {
            ctx.strokeStyle = '#262421'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            pt.pots.forEach((potId, pIdx) => {
              const textY = pt.y - 12 - (pIdx * 13);
              ctx.fillStyle = '#262421';
              ctx.font = '600 9px "Playfair Display"';
              ctx.textAlign = 'center';
              
              const textWidth = ctx.measureText(potId).width + 6;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
              ctx.fillRect(pt.x - textWidth/2, textY - 8, textWidth, 11);
              ctx.lineWidth = 0.5; ctx.strokeStyle = '#262421';
              ctx.strokeRect(pt.x - textWidth/2, textY - 8, textWidth, 11);
              
              ctx.fillStyle = '#262421';
              ctx.fillText(potId, pt.x, textY + 1);

              // 移除之前干扰算错的内部画布 offsetX，直接基于真实的节点本地落点打桩热区
              chartClickRegions.push({
                pot_id: potId, x1: pt.x - textWidth/2, y1: textY - 8, x2: pt.x + textWidth/2, y2: textY + 3
              });
            });
          }
        });
      }

      diaryCanvasElement.addEventListener('click', (e) => {
        const rect = diaryCanvasElement.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        const hit = chartClickRegions.find(r => clickX >= r.x1 && clickX <= r.x2 && clickY >= r.y1 && clickY <= r.y2);
        if (hit) { showPotDetail(hit.pot_id); }
      });

      yearSwitcherBtn.addEventListener('click', () => {
        if (DATABASE.currentYear === 2026) {
          DATABASE.currentYear = 2025; diaryYearTitle.innerText = "2025 Chronology"; yearSwitcherBtn.innerText = "返回 2026 年";
        } else {
          DATABASE.currentYear = 2026; diaryYearTitle.innerText = "2026 Chronology"; yearSwitcherBtn.innerText = "查看 2025 年";
        }
        drawDiaryCurves();
      });

      // 相机操作层
      async function startCamera() {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1080 } }, audio: false });
          cameraPreview.srcObject = cameraStream;
          cameraLayer.setAttribute('aria-hidden', 'false');
        } catch (err) {
          alert("未检测到摄像硬件，已拉起手动信息补充表单空间。");
          stopCamera();
          inputModal.style.display = 'flex';
        }
      }

      function stopCamera() {
        if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
        cameraPreview.srcObject = null;
        cameraLayer.setAttribute('aria-hidden', 'true');
      }

      viewfinderShutter.addEventListener('click', () => {
        if (!cameraStream) return;
        shutterFlash.style.opacity = '1';
        setTimeout(() => shutterFlash.style.opacity = '0', 150);
        const ctx = photoCanvas.getContext('2d');
        photoCanvas.width = cameraPreview.videoWidth; photoCanvas.height = cameraPreview.videoHeight;
        ctx.drawImage(cameraPreview, 0, 0, photoCanvas.width, photoCanvas.height);
        tempCapturedPhoto = photoCanvas.toDataURL('image/jpeg');
        setTimeout(() => { stopCamera(); inputModal.style.display = 'flex'; }, 200);
      });

      document.getElementById('cameraClose').addEventListener('click', () => { stopCamera(); switchTab('wall'); });

      document.getElementById('savePlantBtn').addEventListener('click', () => {
        const potId = document.getElementById('inputPotId').value.trim() || `#P0${DATABASE.pots.length + 1}`;
        const name = document.getElementById('inputName').value.trim() || "未知农作物";
        const family = document.getElementById('inputFamily').value;
        const pickedDate = document.getElementById('inputDate').value || "2026-06-06";
        const parsedMonth = parseInt(pickedDate.split('-')[1]) || 6;

        DATABASE.pots.unshift({
          pot_id: potId, current_plant: name, current_family: family, date: pickedDate, month: parsedMonth,
          photo: tempCapturedPhoto || "https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=300&q=80", history: []
        });

        inputModal.style.display = 'none';
        document.getElementById('inputPotId').value = ""; document.getElementById('inputName').value = "";
        switchTab('wall');
        render3DWall();
      });

      const dockItems = document.querySelectorAll('.dock-item');
      function switchTab(mode) {
        dockItems.forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.querySelector(`[data-mode="${mode}"]`);
        if(targetBtn) targetBtn.classList.add('active');

        detailSheet.setAttribute('aria-hidden', 'true');
        wallViewport.style.display = 'none';
        diaryViewport.setAttribute('aria-hidden', 'true');

        if (mode === 'wall') {
          wallViewport.style.display = 'block'; stopCamera();
        } else if (mode === 'record') {
          startCamera();
        } else if (mode === 'diary') {
          diaryViewport.setAttribute('aria-hidden', 'false'); stopCamera();
          setTimeout(drawDiaryCurves, 50);
        }
      }

      dockItems.forEach(item => { item.addEventListener('click', () => switchTab(item.getAttribute('data-mode'))); });

      render3DWall();
    </script>
  </body>
</html>
