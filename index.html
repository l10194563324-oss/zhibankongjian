<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>植瓣日 - 艺术画廊版</title>
    <!-- 引入高端优雅衬线体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
      /* ==================== 1. 顶级艺术感字体与高级感复位 ==================== */
      :root {
        --bg-color: #f4f3ef;      /* 纯净暖米色底色 */
        --text-color: #2b2925;    /* 高级冷深灰 */
        --accent-color: #5d6b54;  /* 沉稳植物灰绿 */
        --border-color: #e3ded5;
        --card-bg: #ffffff;
        
        /* 字体定义 */
        --font-serif: "Playfair Display", Georgia, serif;
        --font-sans: "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-color);
        user-select: none;
      }

      /* 全局统一字体规则 */
      body {
        font-family: var(--font-sans);
        font-weight: 200; /* 极细正文 */
        -webkit-font-smoothing: antialiased;
      }

      /* 衬线大标题/关键数据标准样式 */
      .serif-heading {
        font-family: var(--font-serif);
        font-weight: 400;
        letter-spacing: 0.05em; /* 开启高字间距 */
      }

      .app-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .paper-grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        z-index: 99;
      }

      .top-bar {
        height: 50px;
        padding: 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        background: rgba(244, 243, 239, 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-color);
      }
      .status-copy { font-size: 14px; font-weight: 600; font-family: var(--font-serif); letter-spacing: 0.05em;}
      .avatar { width: 22px; height: 22px; border-radius: 50%; background: transparent; border: 1px solid var(--text-color); }

      /* ==================== 2. 3D 照片墙视口（保持原效果） ==================== */
      .wall-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        perspective: 600px; 
        perspective-origin: center center;
        touch-action: none;
      }
      .wall-viewport[aria-hidden="true"] { display: none; }

      .wall-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .plant-card {
        position: absolute;
        width: 145px;
        background: var(--card-bg);
        padding: 8px 8px 14px 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.04), 0 4px 10px rgba(0,0,0,0.02);
        border-radius: 0px; /* 极简直角化，更具画廊感 */
        border: 1px solid var(--border-color);
        cursor: pointer;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
      .plant-card .img-placeholder {
        width: 100%; height: 145px; background-color: #eeeadd; background-size: cover; background-position: center;
      }
      .plant-card .card-info { text-align: left; padding: 6px 2px 0 2px; }
      .plant-card .card-title { font-size: 12px; font-weight: 400; color: var(--text-color); font-family: var(--font-sans); }
      .plant-card .card-pot { font-size: 10px; color: #888; font-family: var(--font-serif); letter-spacing: 0.05em; margin-top: 2px; }

      /* ==================== 3. 第三页：Diary 年度记录面板（核心新增） ==================== */
      .diary-viewport {
        flex: 1;
        position: relative;
        overflow-y: auto;
        padding: 24px;
        display: none; /* 默认随模式切换显示 */
        background: var(--bg-color);
        -webkit-overflow-scrolling: touch;
      }
      .diary-viewport[aria-hidden="false"] { display: block; }
      
      .diary-header {
        margin-bottom: 30px;
        border-bottom: 1px solid var(--text-color);
        padding-bottom: 10px;
      }
      .diary-header h2 { font-size: 28px; }
      .diary-header p { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #777; margin-top: 4px; }

      /* 年份大折叠面板 */
      .diary-month-row {
        border-bottom: 1px solid var(--border-color);
        overflow: hidden;
      }
      .month-trigger {
        width: 100%;
        padding: 18px 0;
        background: none;
        border: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        color: var(--text-color);
        text-align: left;
      }
      .month-name { font-size: 18px; font-weight: 400; }
      .month-status { font-size: 11px; font-family: var(--font-sans); font-weight: 300; letter-spacing: 0.05em; color: #888; }
      
      /* 每月每日详情线 */
      .month-content {
        max-height: 0;
        transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      .diary-month-row.open .month-content {
        max-height: 800px; /* 足够大空间展开 */
      }
      
      .day-item {
        padding: 12px 4px;
        border-top: 1px dashed var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .day-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .day-date { font-family: var(--font-serif); font-size: 13px; font-weight: 600; }
      
      /* 【降噪白描轮作提醒标识】 */
      .rotation-badge {
        font-size: 9px;
        font-family: var(--font-sans);
        font-weight: 600;
        letter-spacing: 0.05em;
        padding: 2px 6px;
        border: 1px solid var(--text-color); /* 纯黑白线条白描 */
        background: transparent;
      }
      .rotation-badge.danger {
        border: 1px dashed #a45d54;
        color: #a45d54;
      }
      .day-desc { font-size: 12px; color: #555; font-weight: 300; line-height: 1.5; }

      /* ==================== 4. 极简全屏相机取景框 ==================== */
      .camera-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 200;
        display: none; flex-direction: column; color: #fff;
      }
      .camera-layer[aria-hidden="false"] { display: flex; }
      .camera-frame { flex: 1; display: flex; flex-direction: column; position: relative; }
      .camera-topline { height: 50px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 2px; z-index: 210; background: rgba(0,0,0,0.4); }
      .camera-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
      .camera-close::before { content: "✕"; }
      .viewfinder { flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden; cursor: pointer; }
      #cameraPreview { width: 100%; height: 100%; object-fit: cover; }
      .viewfinder-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.7); pointer-events: none; border: 1px solid rgba(255,255,255,0.4); padding: 6px 16px; font-family: var(--font-sans); letter-spacing: 0.05em; }
      .shutter-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 220; }

      /* ==================== 5. 详情抽屉与表单弹窗 ==================== */
      .detail-sheet {
        position: absolute; top: 0; right: -100%;
        width: 100%; height: 100%;
        background: var(--card-bg); box-shadow: -5px 0 30px rgba(0,0,0,0.05);
        z-index: 150; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        padding: 30px; display: flex; flex-direction: column;
      }
      .detail-sheet[aria-hidden="false"] { right: 0; }
      .sheet-close { background: none; border: none; font-size: 24px; cursor: pointer; margin-bottom: 20px; text-align: left;}
      .sheet-close::before { content: "✕"; }
      .detail-pot-badge { font-size: 11px; color: #888; font-family: var(--font-serif); margin-bottom: 4px; }
      .detail-title { font-size: 24px; margin-bottom: 15px; }
      .history-section { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; }
      .history-title { font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
      .history-item { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; font-weight: 300; }
      .recommend-box { margin-top: auto; border-top: 1px solid var(--text-color); padding-top: 15px; margin-bottom: 60px; }
      .recommend-box h4 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
      .rec-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .rec-tag { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border-color); color: var(--text-color); font-weight: 300; }

      .modal-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 300; display: none; justify-content: center; align-items: center; }
      .input-modal { background: var(--card-bg); padding: 25px; width: 85%; max-width: 300px; border: 1px solid var(--text-color); }
      .input-modal h3 { font-size: 16px; margin-bottom: 15px; text-align: center; }
      .input-modal input, .input-modal select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); font-size: 13px; font-family: var(--font-sans); background: transparent; outline: none; }
      .input-modal button { width: 100%; padding: 12px; background: var(--text-color); color: #fff; border: none; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; font-size: 11px;}

      /* ==================== 6. 底部艺术排版导航栏 ==================== */
      .bottom-dock {
        height: 65px; 
        border-top: 1px solid var(--border-color);
        background: rgba(244, 243, 239, 0.95); 
        backdrop-filter: blur(10px);
        display: flex; 
        justify-content: space-around; 
        align-items: center; 
        z-index: 110;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .dock-item { 
        background: none; border: none; font-size: 11px; color: #a39e93; 
        padding: 12px 24px; font-weight: 400; cursor: pointer;
        text-transform: uppercase; letter-spacing: 0.08em;
        font-family: var(--font-sans);
      }
      /* 操作指示通过纯文字字重变化、黑白小线条点缀本身呈现 */
      .dock-item.active { 
        color: var(--text-color); 
        font-weight: 700; 
        position: relative; 
      }
      .dock-item.active::after { 
        content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 12px; height: 1px; background: var(--text-color); 
      }
    </style>
  </head>
  <body>

    <main class="app-shell">
      <div class="paper-grain"></div>

      <!-- 顶栏 -->
      <header class="top-bar">
        <div class="status-copy serif-heading"><span id="clock">17:14</span></div>
        <button class="avatar" type="button" aria-label="Profile"></button>
      </header>

      <!-- 第一页：Wall 错位照片墙区域 -->
      <section class="wall-viewport" id="wallViewport" aria-hidden="false">
        <div class="wall-canvas" id="wallCanvas"></div>
      </section>

      <!-- 第三页：Diary 年度记录面板区域（新增） -->
      <section class="diary-viewport" id="diaryViewport" aria-hidden="true">
        <div class="diary-header">
          <h2 class="serif-heading">2026 Chronology</h2>
          <p>年度种植轮作及健检日志</p>
        </div>
        
        <div class="diary-timeline-box">
          <!-- 六月 -->
          <div class="diary-month-row">
            <button class="month-trigger" type="button" onclick="toggleMonth(this)">
              <span class="month-name serif-heading">June</span>
              <span class="month-status">3 LOGS · STATUS STABLE</span>
            </button>
            <div class="month-content">
              <div class="day-item">
                <div class="day-meta">
                  <span class="day-date">06.05</span>
                  <span class="rotation-badge">[ ↺ ROTATION DONE ]</span>
                </div>
                <p class="day-desc">#A01号花盆已完成番茄换茬。土壤氮肥轮作期结束，健康度优秀。</p>
              </div>
              <div class="day-item">
                <div class="day-meta">
                  <span class="day-date">06.02</span>
                  <span class="rotation-badge danger">[ ⚠ RISK WARNING ]</span>
                </div>
                <p class="day-desc">检测到#C02号花盆连续两季录入葫芦科作物历史，系统已强行锁定同科重茬推荐。</p>
              </div>
            </div>
          </div>

          <!-- 五月 -->
          <div class="diary-month-row">
            <button class="month-trigger" type="button" onclick="toggleMonth(this)">
              <span class="month-name serif-heading">May</span>
              <span class="month-status">2 LOGS · WELL MANAGED</span>
            </button>
            <div class="month-content">
              <div class="day-item">
                <div class="day-meta">
                  <span class="day-date">05.20</span>
                  <span class="rotation-badge">[ ↺ ROTATION DONE ]</span>
                </div>
                <p class="day-desc">#B03号花盆成功录入羽衣甘蓝（十字花科），上一季豆科根瘤菌改良作用完结。</p>
              </div>
            </div>
          </div>

          <!-- 四月 -->
          <div class="diary-month-row">
            <button class="month-trigger" type="button" onclick="toggleMonth(this)">
              <span class="month-name serif-heading">April</span>
              <span class="month-status">0 LOGS</span>
            </button>
            <div class="month-content">
              <div style="padding: 15px 4px; font-size:12px; color:#999; font-style:italic;">本月暂无新记录。</div>
            </div>
          </div>
        </div>
      </section>

      <!-- 侧边详情抽屉 -->
      <aside class="detail-sheet" id="detailSheet" aria-hidden="true">
        <button class="sheet-close" id="detailClose" type="button"></button>
        <div id="detailContent"></div>
      </aside>

      <!-- 极简全屏拍摄相机 (Record 模式) -->
      <section class="camera-layer" id="cameraLayer" aria-hidden="true">
        <div class="shutter-flash" id="shutterFlash"></div>
        <div class="camera-frame">
          <div class="camera-topline">
            <button class="camera-close" id="cameraClose" type="button"></button>
            <span>RECORD MODE</span>
          </div>
          <div class="viewfinder" id="viewfinderShutter">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div class="viewfinder-hint">TAP SCREEN TO CAPTURE</div>
            <canvas id="photoCanvas" style="display: none;"></canvas>
          </div>
        </div>
      </section>

      <!-- 登记数据表单 -->
      <div class="modal-overlay" id="inputModal">
        <div class="input-modal">
          <h3 class="serif-heading" style="font-weight:600;">NEW RECORD</h3>
          <input type="text" id="inputPotId" placeholder="花盆编号 (如: #A01)" />
          <input type="text" id="inputName" placeholder="植物名称 (如: 圣女果)" />
          <select id="inputFamily">
            <option value="茄科">茄科 (番茄、辣椒、茄子)</option>
            <option value="十字花科">十字花科 (白菜、西兰花)</option>
            <option value="葫芦科">葫芦科 (黄瓜、南瓜、丝瓜)</option>
            <option value="豆科">豆科 (豌豆、豇豆、扁豆)</option>
          </select>
          <button id="savePlantBtn">SAVE & UPLOAD</button>
        </div>
      </div>

      <!-- 底部显性全局控制 Dock -->
      <nav class="bottom-dock">
        <button class="dock-item active" data-mode="wall" type="button">Wall</button>
        <button class="dock-item" data-mode="record" type="button">Record</button>
        <button class="dock-item" data-mode="diary" type="button">Diary</button>
      </nav>
    </main>

    <!-- ==================== 前端交互脚本 ==================== -->
    <script>
      const MOCK_DATA = {
        pots: [
          { pot_id: "#A01", current_plant: "樱桃番茄", current_family: "茄科", photo: "https://images.unsplash.com/photo-1592417817098-8f3d6eb19675?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"黄瓜", family:"葫芦科"}] },
          { pot_id: "#B03", current_plant: "羽衣甘蓝", current_family: "十字花科", photo: "https://images.unsplash.com/photo-1628773822503-930a84518776?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"大豆", family:"豆科"}] },
          { pot_id: "#C02", current_plant: "水果黄瓜", current_family: "葫芦科", photo: "https://images.unsplash.com/photo-1590165482129-1b8b27698780?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"甜椒", family:"茄科"}] },
          { pot_id: "#D05", current_plant: "矮生四季豆", current_family: "豆科", photo: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?auto=format&fit=crop&w=300&q=80", history: [] },
          { pot_id: "#E01", current_plant: "罗勒薄荷", current_family: "唇形科", photo: "https://images.unsplash.com/photo-1536882240095-0379873feb4e?auto=format&fit=crop&w=300&q=80", history: [] },
          { pot_id: "#F02", current_plant: "彩椒", current_family: "茄科", photo: "https://images.unsplash.com/photo-1595855759920-86582396756a?auto=format&fit=crop&w=300&q=80", history: [] }
        ],
        plant_families: {
          "茄科": ["番茄", "辣椒", "茄子", "马铃薯"],
          "十字花科": ["小白菜", "西兰花", "羽衣甘蓝"],
          "葫芦科": ["黄瓜", "南瓜", "丝瓜"],
          "豆科": ["豆角", "豌豆", "毛豆"]
        }
      };

      let transformState = { x: 0, y: 0, z: -100 };
      let isDragging = false;
      let startPointer = { x: 0, y: 0 };
      let touchStartDist = 0;
      let touchScaleZ = 0;

      let cameraStream = null;
      let tempCapturedPhoto = "";

      const wallViewport = document.getElementById('wallViewport');
      const diaryViewport = document.getElementById('diaryViewport');
      const wallCanvas = document.getElementById('wallCanvas');
      const cameraLayer = document.getElementById('cameraLayer');
      const cameraPreview = document.getElementById('cameraPreview');
      const photoCanvas = document.getElementById('photoCanvas');
      const viewfinderShutter = document.getElementById('viewfinderShutter');
      const shutterFlash = document.getElementById('shutterFlash');
      const inputModal = document.getElementById('inputModal');
      const detailSheet = document.getElementById('detailSheet');
      const detailContent = document.getElementById('detailContent');

      // 同步时钟
      setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }, 1000);

      // 3D墙体分布
      function render3DWall() {
        wallCanvas.innerHTML = "";
        MOCK_DATA.pots.forEach((pot, index) => {
          const card = document.createElement('div');
          card.className = "plant-card";
          const posZ = index * -220; 
          const angle = index * 1.1; 
          const radius = 110 + (index * 20); 
          const posX = Math.cos(angle) * radius;
          const posY = Math.sin(angle) * radius * 0.8;

          card.style.transform = `translate3d(${posX}px, ${posY}px, ${posZ}px)`;
          card.innerHTML = `
            <div class="img-placeholder" style="background-image: url('${pot.photo}')"></div>
            <div class="card-info">
              <div class="card-title">${pot.current_plant}</div>
              <div class="card-pot serif-heading">${pot.pot_id}</div>
            </div>
          `;
          card.addEventListener('click', (e) => { e.stopPropagation(); showPotDetail(pot); });
          wallCanvas.appendChild(card);
        });
        updateCanvasTransform();
      }

      function updateCanvasTransform() {
        wallCanvas.style.transform = `translate3d(${transformState.x}px, ${transformState.y}px, ${transformState.z}px)`;
      }

      function getTouchDistance(touches) {
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
      }

      // 手势驱动
      function onPointerDown(e) {
        const isTouch = e.touches ? true : false;
        if (isTouch && e.touches.length === 2) {
          isDragging = false;
          touchStartDist = getTouchDistance(e.touches);
          touchScaleZ = transformState.z;
        } else {
          isDragging = true;
          const clientX = isTouch ? e.touches[0].clientX : e.clientX;
          const clientY = isTouch ? e.touches[0].clientY : e.clientY;
          startPointer = { x: clientX - transformState.x, y: clientY - transformState.y };
        }
      }

      function onPointerMove(e) {
        const isTouch = e.touches ? true : false;
        if (isTouch && e.touches.length === 2) {
          const currentDist = getTouchDistance(e.touches);
          const factor = currentDist / touchStartDist;
          transformState.z = touchScaleZ + (factor - 1) * 450;
          transformState.z = Math.min(500, Math.max(-1500, transformState.z)); 
          updateCanvasTransform();
        } else if (isDragging) {
          const clientX = isTouch ? e.touches[0].clientX : e.clientX;
          const clientY = isTouch ? e.touches[0].clientY : e.clientY;
          transformState.x = clientX - startPointer.x;
          transformState.y = clientY - startPointer.y;
          updateCanvasTransform();
        }
      }

      wallViewport.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', () => isDragging = false);
      wallViewport.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', () => isDragging = false);
      wallViewport.addEventListener('wheel', (e) => { e.preventDefault(); transformState.z += e.deltaY * -0.6; transformState.z = Math.min(500, Math.max(-1500, transformState.z)); updateCanvasTransform(); });

      // 智能推荐
      function showPotDetail(pot) {
        const bannedFamilies = [pot.current_family, ...pot.history.map(h => h.family)];
        let recommendations = [];
        for (let family in MOCK_DATA.plant_families) {
          if (!bannedFamilies.includes(family)) { recommendations.push(...MOCK_DATA.plant_families[family]); }
        }

        detailContent.innerHTML = `
          <div class="detail-pot-badge serif-heading">${pot.pot_id} ARCHIVE</div>
          <h2 class="detail-title serif-heading">${pot.current_plant}</h2>
          <p style="font-size:11px; text-transform:uppercase; color:#777; letter-spacing:0.05em; margin-top:-10px; margin-bottom:15px;">Family: ${pot.current_family}</p>
          
          <div class="history-section">
            <h3 class="history-title">Crop Rotation Timeline</h3>
            <div class="history-item"><span>2026 Season</span><span style="font-weight:400;">${pot.current_plant}</span></div>
            ${pot.history.map(h => `<div class="history-item"><span>${h.year} Season</span><span>${h.plant}</span></div>`).join('')}
          </div>

          <div class="recommend-box">
            <h4>💡 NEXT SEASON SUGGESTION</h4>
            <div class="rec-tags">
              ${recommendations.slice(0, 4).map(r => `<span class="rec-tag">${r}</span>`).join('')}
            </div>
          </div>
        `;
        detailSheet.setAttribute('aria-hidden', 'false');
      }

      document.getElementById('detailClose').addEventListener('click', () => detailSheet.setAttribute('aria-hidden', 'true'));

      // Diary 折叠效果逻辑
      function toggleMonth(element) {
        const row = element.parentElement;
        row.classList.toggle('open');
      }

      // 相机逻辑
      async function startCamera() {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1080 } }, audio: false });
          cameraPreview.srcObject = cameraStream;
          cameraLayer.setAttribute('aria-hidden', 'false');
        } catch (err) {
          alert("提示：未检测到硬件相机。原型已自动为您拉起手动录入表单。");
          stopCamera();
          inputModal.style.display = 'flex';
        }
      }

      function stopCamera() {
        if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
        cameraPreview.srcObject = null;
        cameraLayer.setAttribute('aria-hidden', 'true');
      }

      viewfinderShutter.addEventListener('click', () => {
        if (!cameraStream) return;
        shutterFlash.style.opacity = '1';
        setTimeout(() => shutterFlash.style.opacity = '0', 150);
        const ctx = photoCanvas.getContext('2d');
        photoCanvas.width = cameraPreview.videoWidth; photoCanvas.height = cameraPreview.videoHeight;
        ctx.drawImage(cameraPreview, 0, 0, photoCanvas.width, photoCanvas.height);
        tempCapturedPhoto = photoCanvas.toDataURL('image/jpeg');
        setTimeout(() => { stopCamera(); inputModal.style.display = 'flex'; }, 200);
      });

      document.getElementById('cameraClose').addEventListener('click', () => { stopCamera(); switchTab('wall'); });

      document.getElementById('savePlantBtn').addEventListener('click', () => {
        const potId = document.getElementById('inputPotId').value.trim() || `#P0${MOCK_DATA.pots.length + 1}`;
        const name = document.getElementById('inputName').value.trim() || "新农作物";
        const family = document.getElementById('inputFamily').value;

        MOCK_DATA.pots.unshift({ pot_id: potId, current_plant: name, current_family: family, photo: tempCapturedPhoto || "https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&w=300&q=80", history: [] });
        inputModal.style.display = 'none';
        document.getElementById('inputPotId').value = ""; document.getElementById('inputName').value = "";
        switchTab('wall');
        render3DWall();
      });

      // 菜单导航控制
      const dockItems = document.querySelectorAll('.dock-item');
      function switchTab(mode) {
        dockItems.forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.querySelector(`[data-mode="${mode}"]`);
        if(targetBtn) targetBtn.classList.add('active');

        // 关闭各种弹窗覆盖层
        detailSheet.setAttribute('aria-hidden', 'true');
        wallViewport.style.display = 'none';
        diaryViewport.setAttribute('aria-hidden', 'true');

        if (mode === 'wall') {
          wallViewport.style.display = 'block';
          stopCamera();
        } else if (mode === 'record') {
          startCamera();
        } else if (mode === 'diary') {
          diaryViewport.setAttribute('aria-hidden', 'false');
          stopCamera();
        }
      }

      dockItems.forEach(item => {
        item.addEventListener('click', () => switchTab(item.getAttribute('data-mode')));
      });

      // 启动加载
      render3DWall();
    </script>
  </body>
</html>
