<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>植瓣日 - 3D 轮作记录</title>
    <style>
      /* ==================== 1. 基础复位与 MUJI 极简风样式 ==================== */
      :root {
        --bg-color: #f5f2eb;      /* 暖米色纸张底色 */
        --text-color: #4a463f;    /* 低饱和深灰 */
        --accent-color: #8da47e;  /* 释压植物绿 */
        --border-color: #e6e1d6;
        --card-bg: #fbfbfa;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      /* App 外壳与全屏微幅纸张肌理 */
      .app-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .paper-grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.04;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        z-index: 999;
      }

      /* 顶部状态栏伪装 */
      .top-bar {
        height: 44px;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        border-bottom: 1px solid var(--border-color);
        background: rgba(245, 242, 235, 0.85);
        backdrop-filter: blur(5px);
      }
      .status-copy {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .status-copy span:last-child { margin-left: 8px; font-weight: 400; }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #dfdacb;
        border: none;
        cursor: pointer;
      }

      /* ==================== 2. 3D 无限照片墙视口 ==================== */
      .wall-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        perspective: 1000px; /* 3D 核心：透视深度 */
        cursor: grab;
      }
      .wall-viewport:active { cursor: grabbing; }

      /* 3D 画布，通过 JS 改变 transform 实现推拉平移 */
      .wall-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 单张 3D 照片卡片 */
      .plant-card {
        position: absolute;
        width: 180px;
        background: var(--card-bg);
        padding: 10px 10px 16px 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.06), 0 3px 10px rgba(0,0,0,0.04);
        border-radius: 2px;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }
      .plant-card:hover {
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      }
      .plant-card .img-placeholder {
        width: 100%;
        height: 180px;
        background-color: #eeeadd;
        background-size: cover;
        background-position: center;
        border-radius: 1px;
        margin-bottom: 12px;
      }
      .plant-card .card-info {
        text-align: center;
      }
      .plant-card .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 2px;
      }
      .plant-card .card-pot {
        font-size: 11px;
        color: #9e988a;
        letter-spacing: 0.5px;
      }

      /* ==================== 3. 抽屉式侧边详情页与轮作推荐 ==================== */
      .detail-sheet {
        position: absolute;
        top: 0; right: -100%;
        width: 100%; max-width: 380px; height: 100%;
        background: var(--card-bg);
        box-shadow: -5px 0 30px rgba(0,0,0,0.05);
        z-index: 100;
        transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        padding: 30px;
        display: flex;
        flex-direction: column;
      }
      .detail-sheet[aria-hidden="false"] { right: 0; }
      .sheet-close {
        align-self: flex-start;
        background: none; border: none; font-size: 24px;
        cursor: pointer; color: var(--text-color); margin-bottom: 20px;
      }
      .sheet-close::before { content: "✕"; }

      .detail-pot-badge { font-size: 12px; color: #9e988a; margin-bottom: 5px; }
      .detail-title { font-size: 24px; font-weight: 500; margin-bottom: 15px; }
      .history-section { margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 20px; }
      .history-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #888; }
      .history-item { font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; }
      
      /* 轮作推荐样式板块 */
      .recommend-box {
        margin-top: auto;
        background: #f4f6f2;
        border: 1px dashed var(--accent-color);
        padding: 15px;
        border-radius: 4px;
      }
      .recommend-box h4 { font-size: 13px; color: var(--accent-color); margin-bottom: 8px; }
      .rec-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .rec-tag {
        font-size: 12px; background: #fff; padding: 4px 8px;
        border: 1px solid #e1e6dc; border-radius: 2px; color: #5a6b51;
      }

      /* ==================== 4. 真实相机物理层（核心修改） ==================== */
      .camera-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #111;
        z-index: 200;
        display: none; /* 默认隐藏 */
        flex-direction: column;
        color: #fff;
      }
      .camera-layer[aria-hidden="false"] { display: flex; }
      .camera-frame {
        flex: 1; display: flex; flex-direction: column;
        position: relative; padding-bottom: 40px;
      }
      .camera-topline {
        height: 60px; padding: 0 20px;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 12px; letter-spacing: 2px;
      }
      .camera-close {
        background: none; border: none; color: white; font-size: 22px; cursor: pointer;
      }
      .camera-close::before { content: "✕"; }
      
      /* 取景框 */
      .viewfinder {
        flex: 1; margin: 0 20px; background: #000;
        position: relative; overflow: hidden;
        border-radius: 4px;
      }
      #cameraPreview {
        width: 100%; height: 100%; object-fit: cover;
      }
      .focus-line {
        position: absolute; width: 30px; height: 30px;
        border: 1px solid rgba(255,255,255,0.4); pointer-events: none;
      }
      .focus-line-a { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
      .focus-line-b { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }
      
      /* 快门 */
      .shutter {
        width: 68px; height: 68px; border-radius: 50%;
        background: #fff; border: 4px solid rgba(255,255,255,0.3);
        margin: 25px auto 0 auto; cursor: pointer;
        transition: transform 0.1s;
      }
      .shutter:active { transform: scale(0.92); }

      /* ==================== 5. 日记面板与底部 Dock 栏 ==================== */
      .diary-panel {
        position: absolute;
        bottom: -100%; left: 0; width: 100%; height: 50%;
        background: var(--card-bg);
        border-top: 1px solid var(--border-color);
        box-shadow: 0 -10px 30px rgba(0,0,0,0.03);
        z-index: 90;
        transition: bottom 0.4s ease;
        padding: 20px;
      }
      .diary-panel[aria-hidden="false"] { bottom: 65px; } /* 露出底栏上方 */
      .diary-handle {
        width: 36px; height: 4px; background: #e0dbcd; border-radius: 2px; margin: 0 auto 15px auto;
      }

      .bottom-dock {
        height: 65px;
        border-top: 1px solid var(--border-color);
        background: rgba(245, 242, 235, 0.9);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 10;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .dock-item {
        background: none; border: none; font-size: 12px; font-weight: 500;
        color: #9e988a; cursor: pointer; padding: 10px 20px;
        text-transform: uppercase; letter-spacing: 1px;
      }
      .dock-item.active {
        color: var(--text-color);
        font-weight: 700;
      }

      /* 简单弹窗表单 */
      .modal-overlay {
        position: absolute; top:0; left:0; width:100%; height:100%;
        background: rgba(0,0,0,0.4); z-index: 300;
        display: none; justify-content: center; align-items: center;
      }
      .input-modal {
        background: var(--card-bg); padding: 25px; border-radius: 4px; width: 85%; max-width: 300px;
      }
      .input-modal h3 { font-size: 16px; margin-bottom: 15px; }
      .input-modal input, .input-modal select {
        width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); background: #fff;
      }
      .input-modal button {
        width: 100%; padding: 10px; background: var(--text-color); color: #fff; border: none; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-label="植瓣日 app prototype">
      <div class="paper-grain" aria-hidden="true"></div>

      <header class="top-bar" aria-label="Status bar">
        <div class="status-copy">
          <span id="clock">12:00</span>
          <span>LTE</span>
        </div>
        <button class="avatar" type="button" aria-label="Profile"></button>
      </header>

      <section class="wall-viewport" id="wallViewport" aria-label="Infinite plant wall">
        <div class="wall-canvas" id="wallCanvas"></div>
      </section>

      <aside class="detail-sheet" id="detailSheet" aria-hidden="true">
        <button class="sheet-close" id="detailClose" type="button" aria-label="Close detail"></button>
        <div id="detailContent"></div>
      </aside>

      <section class="camera-layer" id="cameraLayer" aria-hidden="true">
        <div class="camera-frame">
          <div class="camera-topline">
            <button class="camera-close" id="cameraClose" type="button" aria-label="Close camera"></button>
            <span>RECORD MODE</span>
          </div>
          <div class="viewfinder">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div class="focus-line focus-line-a"></div>
            <div class="focus-line focus-line-b"></div>
            <canvas id="photoCanvas" style="display: none;"></canvas>
          </div>
          <button class="shutter" id="shutter" type="button" aria-label="Take photo"></button>
        </div>
      </section>

      <div class="modal-overlay" id="inputModal">
        <div class="input-modal">
          <h3>登记新种植盆栽</h3>
          <input type="text" id="inputPotId" placeholder="花盆编号 (如: #A01)" />
          <input type="text" id="inputName" placeholder="植物名称 (如: 圣女果)" />
          <select id="inputFamily">
            <option value="茄科">茄科 (番茄、辣椒、茄子)</option>
            <option value="十字花科">十字花科 (白菜、西兰花)</option>
            <option value="葫芦科">葫芦科 (黄瓜、南瓜、丝瓜)</option>
            <option value="豆科">豆科 (豌豆、豇豆、扁豆)</option>
          </select>
          <button id="savePlantBtn">确认保存并上墙</button>
        </div>
      </div>

      <section class="diary-panel" id="diaryPanel" aria-hidden="true">
        <div class="diary-handle"></div>
        <div class="diary-heading"><span>JUNE</span><strong>2026</strong></div>
        <article class="diary-copy">
          <p class="diary-date">JUNE 06</p>
          <p>系统健康监测：3D 空间库建立完毕。防连作连障碍算法已启动。</p>
        </article>
      </section>

      <nav class="bottom-dock" aria-label="Main navigation">
        <button class="dock-item active" data-mode="wall" type="button">Wall</button>
        <button class="dock-item" data-mode="record" type="button">Record</button>
        <button class="dock-item" data-mode="diary" type="button">Diary</button>
      </nav>
    </main>

    <script>
      // 1. 模拟数据库：初始数据包含植物科系与花盆历史
      const MOCK_DATA = {
        pots: [
          { pot_id: "#A01", current_plant: "樱桃番茄", current_family: "茄科", photo: "https://images.unsplash.com/photo-1592417817098-8f3d6eb19675?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"黄瓜", family:"葫芦科"}] },
          { pot_id: "#B03", current_plant: "羽衣甘蓝", current_family: "十字花科", photo: "https://images.unsplash.com/photo-1628773822503-930a84518776?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"大豆", family:"豆科"}] },
          { pot_id: "#C02", current_plant: "水果黄瓜", current_family: "葫芦科", photo: "https://images.unsplash.com/photo-1590165482129-1b8b27698780?auto=format&fit=crop&w=300&q=80", history: [{year:2025, plant:"甜椒", family:"茄科"}] }
        ],
        plant_families: {
          "茄科": ["番茄", "辣椒", "茄子", "马铃薯"],
          "十字花科": ["小白菜", "西兰花", "青菜", "羽衣甘蓝"],
          "葫芦科": ["黄瓜", "南瓜", "丝瓜", "苦瓜"],
          "豆科": ["豆角", "豌豆", "毛豆", "蚕豆"]
        }
      };

      // 2. 状态控制
      let transformState = { x: 0, y: 0, z: -100 };
      let isDragging = false;
      let startPointer = { x: 0, y: 0 };
      let cameraStream = null;
      let tempCapturedPhoto = "";

      // DOM 元素获取
      const wallViewport = document.getElementById('wallViewport');
      const wallCanvas = document.getElementById('wallCanvas');
      const cameraLayer = document.getElementById('cameraLayer');
      const cameraPreview = document.getElementById('cameraPreview');
      const photoCanvas = document.getElementById('photoCanvas');
      const inputModal = document.getElementById('inputModal');
      const detailSheet = document.getElementById('detailSheet');
      const detailContent = document.getElementById('detailContent');
      const diaryPanel = document.getElementById('diaryPanel');

      // 3. 初始时钟同步
      setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }, 1000);

      // 4. 渲染 3D 空间照片墙面
      function render3DWall() {
        wallCanvas.innerHTML = "";
        MOCK_DATA.pots.forEach((pot, index) => {
          const card = document.createElement('div');
          card.className = "plant-card";
          
          // 给卡片赋予不同的 3D 错落层级空间位置 (X, Y, Z轴分布)
          const posX = (index - (MOCK_DATA.pots.length-1)/2) * 240;
          const posY = (index % 2 === 0 ? 40 : -40);
          const posZ = (index * -80); // 制造景深错落感

          card.style.transform = `translate3d(${posX}px, ${posY}px, ${posZ}px)`;
          card.innerHTML = `
            <div class="img-placeholder" style="background-image: url('${pot.photo}')"></div>
            <div class="card-info">
              <div class="card-title">${pot.current_plant}</div>
              <div class="card-pot">${pot.pot_id}</div>
            </div>
          `;
          
          // 点击查看卡片详细种植记录并计算推荐
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            showPotDetail(pot);
          });
          wallCanvas.appendChild(card);
        });
        updateCanvasTransform();
      }

      function updateCanvasTransform() {
        wallCanvas.style.transform = `translate3d(${transformState.x}px, ${transformState.y}px, ${transformState.z}px)`;
      }

      // 5. 3D 手势拖拽平移与滚轮推拉缩放
      wallViewport.addEventListener('mousedown', (e) => {
        isDragging = true;
        startPointer = { x: e.clientX - transformState.x, y: e.clientY - transformState.y };
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        transformState.x = e.clientX - startPointer.x;
        transformState.y = e.clientY - startPointer.y;
        updateCanvasTransform();
      });
      window.addEventListener('mouseup', () => isDragging = false);

      // 滚轮控制3D前后深浅位移（3D推拉效果）
      wallViewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        transformState.z += e.deltaY * -0.5; // 向前或向后推拉
        transformState.z = Math.min(200, Math.max(-1000, transformState.z)); // 限制范围
        updateCanvasTransform();
      });

      // 6. 智能防病害轮作推荐引擎
      function showPotDetail(pot) {
        // 获取该盆历史种植过所有科系
        const bannedFamilies = [pot.current_family, ...pot.history.map(h => h.family)];
        
        // 计算下一季推荐作物：过滤掉连作科系
        let recommendations = [];
        for (let family in MOCK_DATA.plant_families) {
          if (!bannedFamilies.includes(family)) {
            // 取出该健康科系下的植物推荐
            recommendations.push(...MOCK_DATA.plant_families[family]);
          }
        }

        detailContent.innerHTML = `
          <div class="detail-pot-badge">${pot.pot_id} 号花盆档案</div>
          <h2 class="detail-title">${pot.current_plant} <span style="font-size:14px; font-weight:normal; color:#8da47e;">(${pot.current_family})</span></h2>
          <p style="font-size:13px; color:#666;">当前状态：当前季作物生长良好，需注意避免连作病害发生。</p>
          
          <div class="history-section">
            <h3 class="history-title">历史种植轴</h3>
            <div class="history-item"><span>2026年 (当前季)</span><span>${pot.current_plant} [${pot.current_family}]</span></div>
            ${pot.history.map(h => `<div class="history-item"><span>${h.year}年</span><span>${h.plant} [${h.family}]</span></div>`).join('')}
          </div>

          <div class="recommend-box">
            <h4>💡 下一季智能轮作推荐 (已避开${bannedFamilies.join('、')}病害)</h4>
            <div class="rec-tags">
              ${recommendations.slice(0, 5).map(r => `<span class="rec-tag">${r}</span>`).join('')}
            </div>
          </div>
        `;
        detailSheet.setAttribute('aria-hidden', 'false');
      }

      document.getElementById('detailClose').addEventListener('click', () => {
        detailSheet.setAttribute('aria-hidden', 'true');
      });

      // ==================== 7. 真实摄影相机操控模块 ====================
      async function startCamera() {
        try {
          // 调用媒体设备，优先唤醒环境后置摄像头
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1080 } },
            audio: false
          });
          cameraPreview.srcObject = cameraStream;
          cameraLayer.setAttribute('aria-hidden', 'false');
        } catch (err) {
          console.error("无法拉起摄像头：", err);
          alert("无法打开您的相机，请确保在 HTTPS 签名环境下运行或允许了浏览器相机使用权限。");
          switchTab('wall');
        }
      }

      function stopCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        cameraPreview.srcObject = null;
        cameraLayer.setAttribute('aria-hidden', 'true');
      }

      // 按下快门触发拍照
      document.getElementById('shutter').addEventListener('click', () => {
        if (!cameraStream) return;
        
        // 执行闪光快门视效
        cameraLayer.style.opacity = '0.4';
        setTimeout(() => cameraLayer.style.opacity = '1', 120);

        const ctx = photoCanvas.getContext('2d');
        photoCanvas.width = cameraPreview.videoWidth;
        photoCanvas.height = cameraPreview.videoHeight;
        
        // 将视频图像绘制至内部 canvas
        ctx.drawImage(cameraPreview, 0, 0, photoCanvas.width, photoCanvas.height);
        
        // 导出图像 Base64 格式
        tempCapturedPhoto = photoCanvas.toDataURL('image/jpeg');
        
        // 关闭相机，唤醒录入录制表单
        stopCamera();
        inputModal.style.display = 'flex';
      });

      document.getElementById('cameraClose').addEventListener('click', () => {
        stopCamera();
        switchTab('wall');
      });

      // 保存新增卡片
      document.getElementById('savePlantBtn').addEventListener('click', () => {
        const potId = document.getElementById('inputPotId').value.trim() || "#N01";
        const name = document.getElementById('inputName').value.trim() || "未知蔬菜";
        const family = document.getElementById('inputFamily').value;

        // 插入模拟数据库前端
        MOCK_DATA.pots.push({
          pot_id: potId,
          current_plant: name,
          current_family: family,
          photo: tempCapturedPhoto,
          history: []
        });

        // 重置表单，刷新 3D 墙壁
        inputModal.style.display = 'none';
        document.getElementById('inputPotId').value = "";
        document.getElementById('inputName').value = "";
        
        switchTab('wall');
        render3DWall();
      });

      // ==================== 8. 导航 Dock 栏底部分配控制 ====================
      const dockItems = document.querySelectorAll('.dock-item');
      function switchTab(mode) {
        dockItems.forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.querySelector(`[data-mode="${mode}"]`);
        if(targetBtn) targetBtn.classList.add('active');

        // 关闭其他互斥抽屉
        detailSheet.setAttribute('aria-hidden', 'true');
        diaryPanel.setAttribute('aria-hidden', 'true');

        if (mode === 'record') {
          startCamera();
        } else {
          stopCamera();
          if (mode === 'diary') {
            diaryPanel.setAttribute('aria-hidden', 'false');
          }
        }
      }

      dockItems.forEach(item => {
        item.addEventListener('click', () => {
          switchTab(item.getAttribute('data-mode'));
        });
      });

      // 初始化启动渲染
      render3DWall();
    </script>
  </body>
</html>
